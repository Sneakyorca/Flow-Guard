# Zero-cost scheduler: GitHub Actions cron runs every due flow in a headless browser.
# Free and unlimited on public repos; private repos get 2,000 free minutes/month.
# Measured Nov 2026: one flow ≈ 69 s per job before caching (npm 13 s, Chromium 22 s, flow 25 s),
# an idle tick ≈ 38 s. GitHub bills private-repo jobs per started minute, so the Chromium cache
# and the "nothing due" skip below keep a typical hourly tick inside 1 billed minute.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY   required to do anything (job skips without them)
#   PUBLIC_APP_URL                            e.g. https://flowguard.vercel.app (for replay links)
#   GEMINI_API_KEY / GROQ_API_KEY             optional, free-tier LLM resolver
#   ANTHROPIC_API_KEY                         optional, paid; used first when set (falls back to Gemini)
#   SLACK_WEBHOOK_URL                         optional fallback when a workspace has no webhook
name: Scheduled flow runs

on:
  schedule:
    - cron: "7 * * * *" # hourly (minute 7 avoids the top-of-hour rush)
  workflow_dispatch:
    inputs:
      flow_id:
        description: "Run a single flow now (leave empty to run all due flows)"
        required: false

concurrency:
  group: scheduled-runs
  cancel-in-progress: false

jobs:
  run-due:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      FLOWGUARD_RESOLVER: ${{ vars.FLOWGUARD_RESOLVER }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets are not configured; skipping scheduled runs."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        run: npm ci --no-audit --no-fund

      # Cheap check first: if no flow is due, skip the browser download entirely.
      - name: Find due flows
        id: plan
        if: steps.check.outputs.enabled == 'true'
        env:
          FLOW_ID: ${{ github.event.inputs.flow_id }}
        run: |
          if [ -n "$FLOW_ID" ]; then
            echo "due=1" >> "$GITHUB_OUTPUT"
          else
            npm run run-due -w @flowguard/worker -- --plan
          fi

      - name: Nothing due, only tidy up old recordings
        if: steps.check.outputs.enabled == 'true' && steps.plan.outputs.due == '0'
        run: npm run run-due -w @flowguard/worker -- --cleanup-only

      - name: Playwright version
        id: pw
        if: steps.plan.outputs.due != '0' && steps.plan.outputs.due != ''
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # The Chromium download is the slow part of every run; keep it between runs.
      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.plan.outputs.due != '0' && steps.plan.outputs.due != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.plan.outputs.due != '0' && steps.plan.outputs.due != '' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/worker

      - name: Install Chromium system libraries (browser restored from cache)
        if: steps.plan.outputs.due != '0' && steps.plan.outputs.due != '' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/worker

      - name: Run due flows
        if: steps.plan.outputs.due != '0' && steps.plan.outputs.due != ''
        env:
          FLOW_ID: ${{ github.event.inputs.flow_id }}
        run: |
          if [ -n "$FLOW_ID" ]; then
            npm run run-due -w @flowguard/worker -- --flow "$FLOW_ID"
          else
            npm run run-due -w @flowguard/worker
          fi

      - name: Keep local artifacts for debugging
        if: always() && steps.plan.outputs.due != '0' && steps.plan.outputs.due != ''
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_id }}
          path: runs/
          retention-days: 3
          if-no-files-found: ignore
